<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold mb-0">{{title}}</h2>
    <button class="btn btn-primary d-flex align-items-center gap-1 shadow-sm rounded-pill px-4 fw-semibold" (click)="onNew.emit()">
        <i class="material-icons" style="font-size: 1.2rem;">add</i>{{btnNewText}}
    </button>
</div>
<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 bg-white">
            <thead class="bg-light">
                <tr>
                    @for(col of columns; track $index){
                        <th class="border-0 text-secondary fw-semibold py-3 px-4">{{col.header}}</th>
                    }
                    <th class="text-center border-0 text-secondary fw-semibold py-3 px-4">Acciones</th>
                </tr>
            </thead>
            <tbody class="border-top-0">
                @for(row of data; track $index){
                    <tr>
                        @for(col of columns; track $index){
                            <td class="py-3 px-4 text-muted border-light">
                                {{getCellValue(row, col)}}
                            </td>
                        }
                        <td class="text-center py-3 px-4 border-light d-flex justify-content-center gap-2">
                            <button class="btn btn-sm btn-outline-info rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;" (click)="onView.emit(row)" title="Ver">
                                <i class="material-icons" style="font-size: 18px;">visibility</i>
                            </button>
                            <button class="btn btn-sm btn-outline-warning rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;" (click)="onEdit.emit(row)" title="Editar">
                                <i class="material-icons" style="font-size: 18px;">edit</i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;" (click)="onDelete.emit(row)" title="Eliminar">
                                <i class="material-icons" style="font-size: 18px;">delete</i>
                            </button>
                        </td>
                    </tr>
                }
                @if(data.length===0){
                    <tr>
                        <td [attr.colspan]="columns.length + 1" class="text-center py-5 text-muted bg-light border-0">
                            <i class="material-icons d-block mb-2 text-secondary" style="font-size: 3rem;">inbox</i>
                            <span class="fs-5 fw-medium">No hay registros para mostrar</span>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
