# Perfil "ci": lo usa la etapa Deploy del pipeline de Jenkins.
# Levanta la API en un entorno de prueba con base H2 en memoria, sin depender de PostgreSQL.
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:h2:mem:ferresys;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

api.security.token.secret=${JWT_SECRET:ferresys-ci-secret}
