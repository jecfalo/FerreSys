# Configuración de pruebas: base H2 en memoria para que `mvnw test` corra sin PostgreSQL
# (en la PC de cualquier integrante y en el agente de Jenkins).
spring.application.name=FerreSys-test
spring.datasource.url=jdbc:h2:mem:ferresys-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

api.security.token.secret=clave-de-pruebas
